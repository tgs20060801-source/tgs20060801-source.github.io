<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 / 登录 - 谭sir的个人网站</title>
    <link rel="stylesheet" href="./styles.css">
    <script defer src="https://cloud.umami.is/script.js" data-website-id="d7a13b04-1505-419a-add0-85c84ff18758"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <nav class="navbar">
        <a href="./index.html">首页</a>
        <a href="./about.html">关于我</a>
        <a href="./projects.html">我的项目</a>
        <a href="./album.html">我的相册</a>
        <a href="./contact.html">联系我</a>
        <a href="./login.html">注册 / 登录</a>
        <button class="theme-toggle" type="button" onclick="toggleTheme()" id="themeToggle" aria-label="切换深色模式">
            🌙 深色模式
        </button>
    </nav>

    <section class="auth auth-page">
        <div class="auth-card">
            <header class="auth-header">
                <h2 id="authTitle" class="auth-title">欢迎回来</h2>
                <p id="authSubtitle" class="auth-subtitle">登录后进入用户中心</p>
            </header>

            <form id="authForm" novalidate>
                <div id="authNicknameField" class="auth-field auth-nickname-field">
                    <input
                        type="text"
                        id="authNickname"
                        placeholder="请输入昵称"
                        autocomplete="nickname"
                    >
                </div>

                <div class="auth-field">
                    <input
                        type="email"
                        id="authEmail"
                        placeholder="请输入邮箱"
                        autocomplete="email"
                    >
                </div>

                <div class="auth-field">
                    <input
                        type="password"
                        id="authPassword"
                        placeholder="请输入密码"
                        autocomplete="current-password"
                    >
                </div>

                <button id="authPrimaryButton" class="auth-primary-button" type="submit">登录</button>

                <p class="auth-switch-text">
                    <span id="authSwitchPrefix">还没有账号？</span>
                    <button id="authSwitchButton" class="auth-switch-button" type="button">立即注册</button>
                </p>

                <p id="authMessage"></p>
            </form>

            <div id="authUserPanel" class="auth-user-panel" hidden>
            <div class="auth-user-card">
                <p class="auth-user-label">当前用户昵称</p>
                <div id="authCurrentNickname" class="auth-user-value"></div>

                <p class="auth-user-label">当前用户邮箱</p>
                <div id="authCurrentEmail" class="auth-user-value"></div>

                <div class="auth-status-actions">
                    <button type="button" id="profileButton" onclick="window.location.href='profile.html'">进入个人主页</button>
                    <button type="button" id="logoutButton" onclick="logoutUser()">退出登录</button>
                </div>
            </div>
            </div>
        </div>
    </section>

    <script src="./script.js"></script>
</body>
</html>
